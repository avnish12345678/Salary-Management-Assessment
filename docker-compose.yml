services:
  postgres:
    image: postgres:16-alpine
    container_name: acme-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: acme_salary
    volumes:
      - acme_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acme_salary"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  acme_pg_data:
