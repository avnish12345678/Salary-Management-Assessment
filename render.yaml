# Render Blueprint for ACME API + managed PostgreSQL.
# Apply from the Render dashboard: New → Blueprint → connect this repo.
# Secrets (JWT_SECRET, etc.) must be set in the Render UI — never commit real values.

databases:
  - name: acme-salary-db
    plan: free
    databaseName: acme_salary
    user: acme

services:
  - type: web
    name: acme-salary-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: acme-salary-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        sync: false
      - key: BCRYPT_SALT_ROUNDS
        value: 10
      - key: LOGIN_RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: LOGIN_RATE_LIMIT_MAX
        value: 20
      - key: LOG_LEVEL
        value: info
